<div class="page-head">
  <div>
    <h1>Operaciones</h1>
    <p>Registra depósitos, retiros y transferencias entre cuentas.</p>
  </div>
</div>

<div class="tabs" role="tablist" aria-label="Tipo de operación">
  <button type="button" role="tab" [class.on]="pestana() === 'deposito'" [attr.aria-selected]="pestana() === 'deposito'" (click)="cambiar('deposito')">Depósito</button>
  <button type="button" role="tab" [class.on]="pestana() === 'retiro'" [attr.aria-selected]="pestana() === 'retiro'" (click)="cambiar('retiro')">Retiro</button>
  <button type="button" role="tab" [class.on]="pestana() === 'transferencia'" [attr.aria-selected]="pestana() === 'transferencia'" (click)="cambiar('transferencia')">Transferencia</button>
</div>

@if (aviso(); as a) { <div class="alert" [class.error]="a.tipo === 'error'" [class.success]="a.tipo === 'success'" role="status">{{ a.texto }}</div> }

<form class="card" #f="ngForm" (ngSubmit)="ejecutar()">
  <div class="form-grid">
    @if (pestana() !== 'transferencia') {
      <div class="field">
        <label for="cta">Cuenta</label>
        <select id="cta" name="cuentaId" [(ngModel)]="cuentaId" required>
          <option [ngValue]="null" disabled>Selecciona una cuenta</option>
          @for (c of cuentas(); track c.id) { <option [ngValue]="c.id">{{ etiqueta(c) }} — {{ c.saldo | currency: 'GTQ' : 'symbol-narrow' }}</option> }
        </select>
      </div>
    } @else {
      <div class="field">
        <label for="org">Cuenta origen</label>
        <select id="org" name="origenId" [(ngModel)]="origenId" required>
          <option [ngValue]="null" disabled>Selecciona la cuenta origen</option>
          @for (c of cuentas(); track c.id) { <option [ngValue]="c.id">{{ etiqueta(c) }} — {{ c.saldo | currency: 'GTQ' : 'symbol-narrow' }}</option> }
        </select>
      </div>
      <div class="field">
        <label for="dst">Cuenta destino</label>
        <select id="dst" name="destinoId" [(ngModel)]="destinoId" required>
          <option [ngValue]="null" disabled>Selecciona la cuenta destino</option>
          @for (c of cuentas(); track c.id) { <option [ngValue]="c.id">{{ etiqueta(c) }}</option> }
        </select>
      </div>
    }
    <div class="field">
      <label for="mto">Monto (Q)</label>
      <input id="mto" name="monto" type="number" min="0.01" step="0.01" [(ngModel)]="monto" required />
    </div>
    <div class="field">
      <label for="dsc">Descripción (opcional)</label>
      <input id="dsc" name="descripcion" [(ngModel)]="descripcion" maxlength="160" />
    </div>
  </div>
  <div class="row" style="margin-top:16px">
    <button type="submit" class="btn" [disabled]="f.invalid || enviando">
      {{ pestana() === 'deposito' ? 'Registrar depósito' : pestana() === 'retiro' ? 'Registrar retiro' : 'Realizar transferencia' }}
    </button>
  </div>
</form>
