<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">B</div>
      <div><b>Banco Académico</b><small>Fundación Kinal · Taller 2</small></div>
    </div>
    <nav class="nav" aria-label="Principal">
      @for (e of enlaces; track e.ruta) {
        <a [routerLink]="e.ruta" routerLinkActive="active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="e.d" /></svg>
          <span>{{ e.texto }}</span>
        </a>
      }
    </nav>
    <div class="side-foot"><span>Datos ficticios · uso educativo</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="user">
        <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
        <div><b>{{ auth.usuario()?.nombre }}</b><small class="muted">{{ auth.usuario()?.rol === 'ADMIN' ? 'Administrador' : 'Cajero' }}</small></div>
      </div>
      <div class="row">
        <app-theme-selector />
        <button type="button" class="btn ghost sm" (click)="auth.logout()">Cerrar sesión</button>
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
  <app-toast-host />
</div>
