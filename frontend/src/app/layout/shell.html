<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">B</div>
      <div><b>Banco Académico</b><small>Fundación Kinal · Taller 2</small></div>
    </div>
    <nav class="nav" aria-label="Principal">
      @for (e of enlaces; track e.ruta) {
        <a [routerLink]="e.ruta" routerLinkActive="active">{{ e.texto }}</a>
      }
    </nav>
    <div class="side-foot">
      <span>Datos ficticios · uso educativo</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <span>Sesión de <b>{{ auth.usuario()?.nombre }}</b> &nbsp;<span class="badge info">{{ auth.usuario()?.rol }}</span></span>
      <div class="row">
        <app-theme-selector />
        <button type="button" class="btn ghost sm" (click)="auth.logout()">Cerrar sesión</button>
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
